[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datago-doctor"
version = "0.1.0"
description = "Diagnose failed data.go.kr (Korea Public Data Portal) OpenAPI responses from any SDK. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "start-up-team-k contributors" }]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
datago-doctor = "datago_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/start-up-team-k/datago-doctor"

[tool.setuptools]
packages = ["datago_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
