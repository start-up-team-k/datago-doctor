# Manual only (workflow_dispatch). Not used until the GP approves PyPI publishing.
# Requires PyPI "trusted publishing" configured for this repo; no token is stored.
name: Publish
on: workflow_dispatch
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
