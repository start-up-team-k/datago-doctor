# Manual only (workflow_dispatch). Not used until the GP approves PyPI publishing.
# PyPI trusted publisher is registered for this file name (workflow.yml); no token is stored.
# The environment name below must match the PyPI publisher setting (being confirmed with the GP).
name: Publish
on: workflow_dispatch
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
